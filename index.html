<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ShopFinderr</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #f5f6fa;
      color: #171717;
    }
    header {
      background: #111827;
      color: white;
      text-align: center;
      padding: 45px 20px;
    }
    header h1 {
      margin: 0;
      font-size: 42px;
      font-weight: 800;
    }
    header h1 span {
      color: #6366f1;
    }
    header p {
      margin-top: 10px;
      color: #d1d5db;
      font-size: 17px;
    }
    .container {
      max-width: 900px;
      margin: 35px auto;
      padding: 0 18px;
    }
    .search-box {
      background: white;
      padding: 25px;
      border-radius: 18px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.08);
    }
    label {
      display: block;
      font-weight: 700;
      margin-bottom: 7px;
    }
    input {
      width: 100%;
      padding: 15px;
      border: 1px solid #d1d5db;
      border-radius: 10px;
      font-size: 16px;
      margin-bottom: 18px;
    }
    input:focus {
      outline: none;
      border-color: #6366f1;
      box-shadow: 0 0 0 3px rgba(99,102,241,.15);
    }
    button {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 10px;
      background: #6366f1;
      color: white;
      font-size: 17px;
      font-weight: 700;
      cursor: pointer;
    }
    button:hover {
      background: #4f46e5;
    }
    #results {
      margin-top: 25px;
    }
    .results-title {
      font-size: 22px;
      font-weight: 800;
      margin-bottom: 15px;
    }
    .store {
      background: white;
      border-radius: 15px;
      padding: 20px;
      margin-bottom: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      box-shadow: 0 4px 18px rgba(0,0,0,0.06);
    }
    .store-name {
      font-size: 19px;
      font-weight: 800;
    }
    .store-info {
      color: #6b7280;
      margin-top: 5px;
      font-size: 14px;
    }
    .store-button {
      background: #111827;
      color: white;
      text-decoration: none;
      padding: 12px 18px;
      border-radius: 9px;
      font-weight: 700;
      white-space: nowrap;
    }
    .store-button:hover {
      background: #374151;
    }
    .message {
      background: white;
      padding: 25px;
      border-radius: 15px;
      text-align: center;
      color: #6b7280;
    }
    .notice {
      margin-top: 15px;
      font-size: 13px;
      color: #6b7280;
      line-height: 1.5;
    }
    @media (max-width: 600px) {
      header h1 {
        font-size: 34px;
      }
      .store {
        flex-direction: column;
        align-items: stretch;
      }
      .store-button {
        text-align: center;
      }
    }
  </style>
</head>
<body>
<header>
  <h1>Shop<span>Finderr</span></h1>
  <p>Find what you want. Stay within your budget.</p>
</header>
<div class="container">
  <div class="search-box">
    <label for="product">What are you looking for?</label>
    <input
      id="product"
      type="text"
      placeholder="Example: Coach purse"
    >
    <label for="budget">What's your budget?</label>
    <input
      id="budget"
      type="number"
      min="1"
      step="1"
      placeholder="Example: 120"
    >
    <button onclick="findProducts()">
      Find It
    </button>
    <div class="notice">
      ShopFinderr searches retailer and shopping-search pages using your product and maximum budget.
      Prices and availability can change on the retailer's website.
    </div>
  </div>
  <div id="results"></div>
</div>
<script>
function findProducts() {
  const product =
    document.getElementById("product").value.trim();
  const budget =
    document.getElementById("budget").value.trim();
  const results =
    document.getElementById("results");
  if (!product) {
    results.innerHTML =
      '<div class="message">Enter a product first.</div>';
    return;
  }
  if (!budget || Number(budget) <= 0) {
    results.innerHTML =
      '<div class="message">Enter a valid budget.</div>';
    return;
  }
  const searchQuery =
    `${product} under $${budget}`;
  const encoded =
    encodeURIComponent(searchQuery);
  const stores = [
    {
      name: "Google Shopping",
      description: "Compare products from many different stores.",
      url:
        `https://www.google.com/search?tbm=shop&q=${encoded}`
    },
    {
      name: "Bing Shopping",
      description: "Search products from multiple retailers.",
      url:
        `https://www.bing.com/shop?q=${encoded}`
    },
    {
      name: "Amazon",
      description: "Search Amazon for products within your budget.",
      url:
        `https://www.amazon.com/s?k=${encoded}`
    },
    {
      name: "Walmart",
      description: "Search Walmart's product catalog.",
      url:
        `https://www.walmart.com/search?q=${encoded}`
    },
    {
      name: "Target",
      description: "Search Target's available products.",
      url:
        `https://www.target.com/s?searchTerm=${encoded}`
    },
    {
      name: "eBay",
      description: "Search new and used products on eBay.",
      url:
        `https://www.ebay.com/sch/i.html?_nkw=${encoded}`
    },
    {
      name: "Macy's",
      description: "Search Macy's products.",
      url:
        `https://www.macys.com/shop/featured/${encoded}`
    },
    {
      name: "Nordstrom",
      description: "Search Nordstrom products.",
      url:
        `https://www.nordstrom.com/sr?keyword=${encodeURIComponent(product)}`
    },
    {
      name: "Coach",
      description: "Search Coach's official store.",
      url:
        `https://www.coach.com/search?q=${encodeURIComponent(product)}`
    }
  ];
  let html = `
    <div class="results-title">
      Results for "${escapeHTML(product)}" under $${escapeHTML(budget)}
    </div>
  `;
  stores.forEach(store => {
    html += `
      <div class="store">
        <div>
          <div class="store-name">
            ${store.name}
          </div>
          <div class="store-info">
            ${store.description}
          </div>
        </div>
        <a
          class="store-button"
          href="${store.url}"
          target="_blank"
          rel="noopener noreferrer"
        >
          View Items
        </a>
      </div>
    `;
  });
  results.innerHTML = html;
  window.scrollTo({
    top: results.offsetTop - 20,
    behavior: "smooth"
  });
}
function escapeHTML(text) {
  return text.replace(/[&<>"']/g, function(character) {
    return {
      "&": "&amp;",
      "<": "&lt;",
      ">": "&gt;",
      '"': "&quot;",
      "'": "&#039;"
    }[character];
  });
}
document
  .getElementById("product")
  .addEventListener("keydown", function(event) {
    if (event.key === "Enter") {
      findProducts();
    }
  });
document
  .getElementById("budget")
  .addEventListener("keydown", function(event) {
    if (event.key === "Enter") {
      findProducts();
    }
  });
</script>
</body>
</html>
